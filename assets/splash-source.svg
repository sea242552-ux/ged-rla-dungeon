<svg width="2732" height="2732" viewBox="0 0 2732 2732" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="2732" height="2732" fill="url(#bg)"/>

  <!-- Crossed swords -->
  <g transform="translate(1366,1180)">
    <g transform="rotate(-45)">
      <rect x="-20" y="-320" width="40" height="420" rx="8" fill="url(#blade)"/>
      <rect x="-90" y="90" width="180" height="42" rx="12" fill="#3f3f46"/>
      <rect x="-20" y="115" width="40" height="160" rx="12" fill="#71717a"/>
      <circle cx="0" cy="290" r="32" fill="#a1a1aa"/>
    </g>
    <g transform="rotate(45)">
      <rect x="-20" y="-320" width="40" height="420" rx="8" fill="url(#blade)"/>
      <rect x="-90" y="90" width="180" height="42" rx="12" fill="#3f3f46"/>
      <rect x="-20" y="115" width="40" height="160" rx="12" fill="#71717a"/>
      <circle cx="0" cy="290" r="32" fill="#a1a1aa"/>
    </g>
  </g>

  <!-- Game title -->
  <text x="1366" y="1650" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold" font-size="140" fill="#fbbf24">GED RLA</text>
  <text x="1366" y="1800" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold" font-size="140" fill="#f4f4f5">DUNGEON</text>
</svg>
