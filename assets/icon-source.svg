<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Crossed swords, kept well within the center safe-zone for adaptive icon masking -->
  <g transform="translate(512,512)">
    <g transform="rotate(-45)">
      <rect x="-12" y="-160" width="24" height="220" rx="6" fill="url(#blade)"/>
      <rect x="-50" y="46" width="100" height="26" rx="8" fill="#3f3f46"/>
      <rect x="-12" y="60" width="24" height="90" rx="8" fill="#71717a"/>
      <circle cx="0" cy="158" r="18" fill="#a1a1aa"/>
    </g>
    <g transform="rotate(45)">
      <rect x="-12" y="-160" width="24" height="220" rx="6" fill="url(#blade)"/>
      <rect x="-50" y="46" width="100" height="26" rx="8" fill="#3f3f46"/>
      <rect x="-12" y="60" width="24" height="90" rx="8" fill="#71717a"/>
      <circle cx="0" cy="158" r="18" fill="#a1a1aa"/>
    </g>
  </g>
</svg>
